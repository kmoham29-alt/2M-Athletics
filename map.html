*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1628;--surface:#111e35;--surface2:#162240;
  --text:#e8edf5;--muted:#8899bb;--border:#1e3058;
  --gold:#f5a623;--green0:#1e2d40;--green1:#1a4a2e;
  --green2:#166534;--green3:#15803d;--green4:#16a34a;--green5:#22c55e;
  --panel-w:380px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:.02em}
header span{color:var(--muted);font-size:.85rem}
.nav-back{color:var(--gold);font-size:.85rem;text-decoration:none;border:1px solid var(--gold);padding:4px 12px;border-radius:4px;margin-left:auto}
.nav-back:hover{background:var(--gold);color:#000}
main{display:flex;flex:1;overflow:hidden}

/* MAP AREA */
.map-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.map-controls{padding:12px 20px;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--border)}
.map-controls label{font-size:.8rem;color:var(--muted)}
.legend{display:flex;align-items:center;gap:6px;margin-left:auto}
.legend-item{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.legend-swatch{width:14px;height:14px;border-radius:2px}
.map-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#us-map{width:100%;max-width:900px;height:auto;display:block}
.state-path{cursor:pointer;transition:opacity .12s}
.state-path:hover{opacity:.82}
.state-path.selected{stroke:var(--gold)!important;stroke-width:2.5!important}

/* TOOLTIP */
#tooltip{position:fixed;background:rgba(10,22,40,.95);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.8rem;pointer-events:none;display:none;z-index:999;white-space:nowrap}
#tooltip strong{color:#fff;display:block}
#tooltip span{color:var(--muted)}

/* PANEL */
.panel{width:var(--panel-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(var(--panel-w));transition:transform .25s ease;overflow:hidden}
.panel.open{transform:translateX(0)}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.panel-header h2{font-size:1.05rem;font-weight:700;flex:1}
.panel-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.panel-close:hover{color:#fff;background:var(--border)}
.panel-body{flex:1;overflow-y:auto;padding:16px}
.panel-stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.panel-stat .big{font-size:2rem;font-weight:800;color:var(--gold)}
.panel-stat .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.org-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.org-card .org-name{font-weight:600;font-size:.9rem;margin-bottom:4px}
.org-card .org-meta{font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-fp{background:#1e3a1e;color:#4ade80}
.badge-np{background:#1e2a3a;color:#60a5fa}
.badge-girls{background:#3a1e3a;color:#e879f9}
.badge-coed{background:#2a1e10;color:#f5a623}
.family-tag{font-size:.7rem;background:var(--border);color:var(--muted);padding:2px 8px;border-radius:10px}
.org-links a{color:var(--gold);font-size:.72rem;text-decoration:none;margin-right:8px}
.org-links a:hover{text-decoration:underline}
.org-revenue{font-size:.75rem;color:#4ade80;margin-top:4px}
.section-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.national-note{background:#162240;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;font-size:.8rem;color:var(--muted);text-align:center}
.no-state{padding:40px 20px;text-align:center;color:var(--muted)}
.no-state .icon{font-size:2.5rem;margin-bottom:12px}
</style>
</head>

// ── BUILD STATE → ORGS MAP ──────────────────────────────────────────────────
function getStatesForOrg(org) {
  const s = org.state;
  if (!s || s === 'National' || s === 'Multi-state') return [];
  return s.split('/').map(x => x.trim()).filter(x => STATE_NAMES[x]);
}

const stateOrgs = {};
Object.keys(STATE_NAMES).forEach(k => stateOrgs[k] = []);
ORGS.forEach(org => {
  getStatesForOrg(org).forEach(st => stateOrgs[st].push(org));
});

const nationalOrgs = ORGS.filter(o => o.state === 'National' || o.state === 'Multi-state');

// ── COUNT FUNCTION ──────────────────────────────────────────────────────────
function colorForCount(n) {
  if (n === 0) return '#1e2d40';
  if (n <= 2) return '#1a4a2e';
  if (n <= 5) return '#166534';
  if (n <= 9) return '#15803d';
  return '#16a34a';
}

// ── RENDER MAP ──────────────────────────────────────────────────────────────
const svg = document.getElementById('us-map');

// Add state border stroke base
const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
svg.appendChild(defs);

// Background
const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
bg.setAttribute('width','960');bg.setAttribute('height','600');
bg.setAttribute('fill','#0a1628');
svg.appendChild(bg);

// Draw label for Alaska & Hawaii insets
['AK → Alaska','HI → Hawaii'].forEach((lbl,i)=>{
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', i===0?'165':'388');
  t.setAttribute('y', i===0?'458':'468');
  t.setAttribute('fill','#8899bb');t.setAttribute('font-size','9');
  t.textContent = i===0?'AK':'HI';
  svg.appendChild(t);
});

let selectedState = null;

Object.entries(STATE_PATHS).forEach(([abbr, d]) => {
  const count = stateOrgs[abbr] ? stateOrgs[abbr].length : 0;
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', d);
  path.setAttribute('fill', colorForCount(count));
  path.setAttribute('stroke','#0a1628');
  path.setAttribute('stroke-width','1.5');
  path.setAttribute('class','state-path');
  path.setAttribute('data-abbr', abbr);
  path.setAttribute('data-count', count);

  path.addEventListener('mousemove', e => {
    const tip = document.getElementById('tooltip');
    document.getElementById('tt-state').textContent = STATE_NAMES[abbr];
    document.getElementById('tt-count').textContent = count + ' organization' + (count!==1?'s':'');
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top = (e.clientY - 10) + 'px';
  });
  path.addEventListener('mouseleave', () => {
    document.getElementById('tooltip').style.display = 'none';
  });
  path.addEventListener('click', () => {
    if (selectedState) {
      const prev = svg.querySelector(`[data-abbr="${selectedState}"]`);
      if (prev) prev.classList.remove('selected');
    }
    selectedState = abbr;
    path.classList.add('selected');
    showPanel(abbr);
  });

  svg.appendChild(path);

  // State label (abbreviated)
  const bbox = getBBoxApprox(d);
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', bbox.cx);
  t.setAttribute('y', bbox.cy + 4);
  t.setAttribute('text-anchor','middle');
  t.setAttribute('fill', count > 0 ? '#fff' : '#4a6080');
  t.setAttribute('font-size', abbr.length > 2 ? '7' : '8');
  t.setAttribute('font-family','Segoe UI,system-ui,sans-serif');
  t.setAttribute('pointer-events','none');
  t.textContent = abbr;
  svg.appendChild(t);
});

function getBBoxApprox(d) {
  const nums = d.match(/-?\d+\.?\d*/g).map(Number);
  const xs = [], ys = [];
  for (let i = 0; i < nums.length; i += 2) { xs.push(nums[i]); ys.push(nums[i+1]); }
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  return { cx: (minX+maxX)/2, cy: (minY+maxY)/2 };
}

// ── PANEL ───────────────────────────────────────────────────────────────────
function fmtRev(n) {
  if (!n) return 'N/A';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(0) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n;
}

function showPanel(abbr) {
  const orgs = stateOrgs[abbr] || [];
  const stateName = STATE_NAMES[abbr];
  document.getElementById('panel-title').textContent = stateName;
  document.getElementById('panel').classList.add('open');

  const body = document.getElementById('panel-body');
  if (orgs.length === 0) {
    body.innerHTML = `<div class="no-state"><div class="icon">🏈</div><p>No organizations recorded in ${stateName} yet.</p></div>`;
    return;
  }

  // Summary stats
  const totalRev = orgs.reduce((s,o)=>s+(o.rev||0),0);
  const npCount = orgs.filter(o=>o.biz==='NONPROFIT').length;
  const fpCount = orgs.filter(o=>o.biz==='FOR-PROFIT').length;

  let html = `
  <div class="panel-stat">
    <div class="big">${orgs.length}</div>
    <div class="label">Organizations</div>
  </div>
  <div class="panel-stat" style="display:flex;gap:16px;background:none;border:none;padding:0;margin-bottom:4px">
    <div style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">
      <div style="font-size:1.2rem;font-weight:700;color:#4ade80">${fpCount}</div>
      <div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">For-Profit</div>
    </div>
    <div style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">
      <div style="font-size:1.2rem;font-weight:700;color:#60a5fa">${npCount}</div>
      <div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Nonprofit</div>
    </div>
  </div>
  <div class="panel-stat" style="margin-bottom:16px">
    <div class="big" style="font-size:1.4rem">${fmtRev(totalRev)}</div>
    <div class="label">Est. Combined Annual Revenue</div>
  </div>
  <div class="section-label">Organizations</div>`;

  // Sort: for-profit first, then nonprofit; co-ed before girls
  const sorted = [...orgs].sort((a,b) => {
    if (a.biz !== b.biz) return a.biz === 'FOR-PROFIT' ? -1 : 1;
    if (a.gender !== b.gender) return a.gender === 'Co-ed' ? -1 : 1;
    return (a.rev||0) > (b.rev||0) ? -1 : 1;
  });

  sorted.forEach(org => {
    const familyLabel = FAMILY_NAMES[org.family] || org.family;
    const revStr = fmtRev(org.rev);
    const links = [];
    if (org.website) links.push(`<a href="${org.website}" target="_blank">🌐 Website</a>`);
    if (org.ig) links.push(`<a href="https://instagram.com/${org.ig.replace('@','')}" target="_blank">📷 ${org.ig}</a>`);
    if (org.email) links.push(`<a href="mailto:${org.email}">✉️ Email</a>`);
    if (org.phone) links.push(`<a href="tel:${org.phone}">📞 ${org.phone}</a>`);

    html += `<div class="org-card">
      <div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px">
        <div class="org-name" style="flex:1">${org.name}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
        <span class="badge ${org.biz==='FOR-PROFIT'?'badge-fp':'badge-np'}">${org.biz==='FOR-PROFIT'?'For-Profit':'Nonprofit'}</span>
        <span class="badge ${org.gender==='Girls'?'badge-girls':'badge-coed'}">${org.gender}</span>
        <span class="family-tag">${familyLabel}</span>
      </div>
      <div class="org-meta">
        ${org.city ? `<span>📍 ${org.city}</span>` : ''}
        ${org.founded ? `<span>📅 Est. ${org.founded}</span>` : ''}
        ${org.head ? `<span>👤 ${org.head}${org.title?', '+org.title:''}</span>` : ''}
      </div>
      <div class="org-revenue">💰 ${revStr} est. annual revenue${org.revnote?` — <span style="color:var(--muted);font-weight:400">${org.revnote}</span>`:''}
      </div>
      ${links.length ? `<div class="org-links" style="margin-top:6px">${links.join('')}</div>` : ''}
    </div>`;
  });

  body.innerHTML = html;
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  if (selectedState) {
    const prev = svg.querySelector(`[data-abbr="${selectedState}"]`);
    if (prev) prev.classList.remove('selected');
    selectedState = null;
  }
}
