*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
/* HEADER */
header{background:linear-gradient(135deg,#0a1628 0%,#1a2d5a 100%);color:#fff;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
header h1{font-size:1.2rem;font-weight:700;letter-spacing:0.5px}
header h1 span{color:#f5a623}
.header-stats{display:flex;gap:24px;font-size:0.75rem;opacity:0.8}
.header-stats strong{color:#f5a623}
/* BREADCRUMB */
.breadcrumb{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 32px;display:flex;align-items:center;gap:8px;font-size:0.8rem;color:#64748b}
.breadcrumb a{color:#3b82f6;text-decoration:none;cursor:pointer;font-weight:500}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb span{color:#94a3b8}
/* MAIN */
main{max-width:1400px;margin:0 auto;padding:28px 32px}
/* SEARCH / FILTER BAR */
.toolbar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:240px;padding:10px 16px;border:1px solid #d1d5db;border-radius:8px;font-size:0.875rem;outline:none;background:#fff}
.toolbar input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.filter-btn{padding:9px 16px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:0.8rem;cursor:pointer;font-weight:500;white-space:nowrap;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{background:#0a1628;color:#fff;border-color:#0a1628}
.filter-btn.fp.active{background:#dc2626;border-color:#dc2626}
.filter-btn.np.active{background:#16a34a;border-color:#16a34a}
/* SECTION HEADER */
.section-title{font-size:0.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#94a3b8;margin-bottom:12px;margin-top:28px}
.section-title:first-child{margin-top:0}
/* LEAGUE CARDS GRID */
.league-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.league-card{background:#fff;border-radius:12px;padding:20px;cursor:pointer;border:2px solid transparent;transition:all 0.18s;box-shadow:0 1px 4px rgba(0,0,0,0.07)}
.league-card:hover{border-color:#3b82f6;box-shadow:0 4px 20px rgba(59,130,246,0.15);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-name{font-size:0.95rem;font-weight:700;line-height:1.3;flex:1;padding-right:8px}
.badge{font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge.fp{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.badge.np{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.badge.mixed{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.card-meta{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.meta-item{font-size:0.75rem;color:#64748b}
.meta-item strong{color:#1a1a2e;font-weight:600}
.card-revenue{font-size:0.8rem;font-weight:700;color:#f5a623;margin-top:8px}
.card-footer{margin-top:12px;padding-top:12px;border-top:1px solid #f1f5f9;display:flex;gap:6px;flex-wrap:wrap}
.state-pill{font-size:0.68rem;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:10px;font-weight:500}
.state-pill.more{background:#e0e7ff;color:#3730a3}
/* STATE GRID */
.state-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.state-card{background:#fff;border-radius:10px;padding:16px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;box-shadow:0 1px 4px rgba(0,0,0,0.07);text-align:center}
.state-card:hover{border-color:#f5a623;box-shadow:0 4px 16px rgba(245,166,35,0.2);transform:translateY(-1px)}
.state-card .state-name{font-size:0.95rem;font-weight:700;margin-bottom:4px}
.state-card .state-count{font-size:0.75rem;color:#64748b}
/* TEAM CARDS */
.team-list{display:flex;flex-direction:column;gap:16px}
.team-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.07);border-left:4px solid #3b82f6}
.team-card.fp{border-left-color:#dc2626}
.team-card.np{border-left-color:#16a34a}
.team-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.team-card-name{font-size:1.1rem;font-weight:700}
.team-card-name a{color:#1a1a2e;text-decoration:none}
.team-card-name a:hover{color:#3b82f6;text-decoration:underline}
.team-badges{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.gender-badge{font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:20px;background:#f8f4ff;color:#7c3aed;border:1px solid #ddd6fe}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 24px;margin-bottom:16px}
.team-field label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#94a3b8;display:block;margin-bottom:2px}
.team-field span{font-size:0.82rem;color:#1a1a2e;font-weight:500}
.team-field span.na{color:#cbd5e1;font-style:italic}
.team-social{display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid #f1f5f9;align-items:center}
.social-link{display:inline-flex;align-items:center;gap:5px;font-size:0.75rem;font-weight:600;padding:5px 12px;border-radius:6px;text-decoration:none;transition:opacity 0.15s}
.social-link:hover{opacity:0.8}
.social-link.ig{background:#fce7f3;color:#be185d}
.social-link.fb{background:#eff6ff;color:#1d4ed8}
.social-link.tw{background:#f0f9ff;color:#0369a1}
.social-link.web{background:#f0fdf4;color:#15803d}
.revenue-row{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:0.78rem}
.revenue-row strong{color:#b45309}
.revenue-row span{color:#92400e}
/* BACK BUTTON */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:#fff;border:1px solid #d1d5db;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;color:#374151;margin-bottom:20px;transition:all 0.15s}
.back-btn:hover{background:#f9fafb;border-color:#9ca3af}
/* LEAGUE DETAIL HEADER */
.league-detail-header{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,0.07)}
.ldh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ldh-name{font-size:1.4rem;font-weight:800}
.ldh-meta{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.ldh-meta-item{font-size:0.8rem;color:#64748b}
.ldh-meta-item strong{color:#1a1a2e;font-size:0.9rem}
/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.empty h3{font-size:1.1rem;margin-bottom:8px;color:#64748b}
/* RESPONSIVE */
@media(max-width:640px){
  main{padding:16px}
  header{padding:0 16px}
  header h1{font-size:1rem}
  .header-stats{display:none}
  .breadcrumb{padding:10px 16px}
  .league-grid{grid-template-columns:1fr}
  .state-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmtRev(s) {
  if(!s||s==='N/A') return 'N/A';
  const n = parseInt(s.replace(/[^0-9]/g,''));
  if(isNaN(n)) return s;
  if(n>=1000000) return '$'+(n/1000000).toFixed(n%1000000===0?0:1)+'M';
  if(n>=1000) return '$'+(n/1000).toFixed(0)+'K';
  return '$'+n;
}
function na(v){ return (!v||v==='N/A'||v==='')?null:v; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Get unique states for a list of orgs
function statesFor(orgs){
  const map = {};
  orgs.forEach(o => {
    const ss = o.state.split('/');
    ss.forEach(s => {
      s = s.trim();
      if(!map[s]) map[s]=[];
      map[s].push(o);
    });
  });
  return map;
}

  } else if(view==='states'){
    bc.innerHTML = `<a onclick="goHome()">All Leagues</a><span>›</span><span>${esc(currentFamily.name)}</span>`;
  } else {
    bc.innerHTML = `<a onclick="goHome()">All Leagues</a><span>›</span><a onclick="goStates('${currentFamily.id}')">${esc(currentFamily.name)}</a><span>›</span><span>${esc(currentState)}</span>`;
  }
}

function renderHome(){
  const m = document.getElementById('main');
  const q = searchQ.toLowerCase();

  // Build family data
  const familyData = FAMILIES.map(fam => {
    let members;
    if(fam.id==='indep'){
      members = orgs.filter(o=>o.family==='indep');
    } else {
      members = orgs.filter(o=>o.family===fam.id);
    }
    if(!members.length) return null;

    // Apply search
    if(q && !fam.name.toLowerCase().includes(q) && !members.some(o=>o.name.toLowerCase().includes(q)||o.city.toLowerCase().includes(q)||o.state.toLowerCase().includes(q))){
      return null;
    }
    // Apply BT filter
    if(filterBT!=='all'){
      const ft = filterBT==='fp'?'FOR-PROFIT':'NONPROFIT';
      if(!members.some(o=>o.bt===ft)) return null;
    }

    // States
    const stateMap = statesFor(members);
    const states = Object.keys(stateMap).sort();

    // Revenue sum
    const revTotal = members.reduce((sum,o)=>{
      const n=parseInt((o.rev||'').replace(/[^0-9]/g,''));
      return sum+(isNaN(n)?0:n);
    },0);

    // Business type
    const hasFP = members.some(o=>o.bt==='FOR-PROFIT');
    const hasNP = members.some(o=>o.bt==='NONPROFIT');
    const btClass = hasFP&&hasNP?'mixed':hasFP?'fp':'np';
    const btLabel = hasFP&&hasNP?'For-Profit + Nonprofit':hasFP?'For-Profit':'Nonprofit';
    const sortKey = hasFP?0:1;

    return {fam, members, states, stateMap, revTotal, btClass, btLabel, sortKey};
  }).filter(Boolean);

  familyData.sort((a,b)=>a.sortKey-b.sortKey||a.fam.name.localeCompare(b.fam.name));

  const fpItems = familyData.filter(d=>d.sortKey===0);
  const npItems = familyData.filter(d=>d.sortKey===1);

  let html = `
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍  Search leagues, states, cities…" value="${esc(searchQ)}" oninput="searchQ=this.value;render()">
      <button class="filter-btn ${filterBT==='all'?'active':''}" onclick="filterBT='all';render()">All</button>
      <button class="filter-btn fp ${filterBT==='fp'?'active':''}" onclick="filterBT='fp';render()">For-Profit</button>
      <button class="filter-btn np ${filterBT==='np'?'active':''}" onclick="filterBT='np';render()">Nonprofit</button>
    </div>`;

  function renderCards(items, title){
    if(!items.length) return '';
    let s = `<div class="section-title">${title} (${items.length})</div><div class="league-grid">`;
    items.forEach(({fam,members,states,revTotal,btClass,btLabel})=>{
      const displayStates = states.slice(0,6);
      const extra = states.length-6;
      s += `<div class="league-card" onclick="goStates('${fam.id}')">
        <div class="card-top">
          <div class="card-name">${esc(fam.name)}</div>
          <span class="badge ${btClass}">${btLabel}</span>
        </div>
        <div class="card-meta">
          <div class="meta-item"><strong>${members.length}</strong> org${members.length>1?'s':''}</div>
          <div class="meta-item"><strong>${states.length}</strong> state${states.length>1?'s':''}</div>
        </div>
        <div class="card-revenue">${fmtRev('$'+revTotal)}</div>
        <div class="card-footer">
          ${displayStates.map(s=>`<span class="state-pill">${esc(s)}</span>`).join('')}
          ${extra>0?`<span class="state-pill more">+${extra} more</span>`:''}
        </div>
      </div>`;
    });
    s += '</div>';
    return s;
  }

  html += renderCards(fpItems, '🔴 FOR-PROFIT Leagues');
  html += renderCards(npItems, '🟢 NONPROFIT Leagues');

  if(!fpItems.length && !npItems.length){
    html += `<div class="empty"><h3>No results found</h3><p>Try a different search term or filter.</p></div>`;
  }

  m.innerHTML = html;
}

function renderStates(){
  const m = document.getElementById('main');
  const fam = currentFamily;
  let members;
  if(fam.id==='indep'){
    members = orgs.filter(o=>o.family==='indep');
  } else {
    members = orgs.filter(o=>o.family===fam.id);
  }

  const stateMap = statesFor(members);
  const states = Object.keys(stateMap).sort();

  // Header info
  const revTotal = members.reduce((sum,o)=>{const n=parseInt((o.rev||'').replace(/[^0-9]/g,''));return sum+(isNaN(n)?0:n);},0);
  const hasFP = members.some(o=>o.bt==='FOR-PROFIT');
  const hasNP = members.some(o=>o.bt==='NONPROFIT');
  const btClass = hasFP&&hasNP?'mixed':hasFP?'fp':'np';
  const btLabel = hasFP&&hasNP?'For-Profit + Nonprofit':hasFP?'For-Profit':'Nonprofit';

  let html = `
    <button class="back-btn" onclick="goHome()">← Back to All Leagues</button>
    <div class="league-detail-header">
      <div class="ldh-top">
        <div class="ldh-name">${esc(fam.name)}</div>
        <span class="badge ${btClass}">${btLabel}</span>
      </div>
      <div class="ldh-meta">
        <div class="ldh-meta-item"><label>Organizations</label><strong>${members.length}</strong></div>
        <div class="ldh-meta-item"><label>States</label><strong>${states.length}</strong></div>
        <div class="ldh-meta-item"><label>Est. Total Revenue</label><strong style="color:#f5a623">${fmtRev('$'+revTotal)}</strong></div>
      </div>
    </div>
    <div class="section-title">Select a State (${states.length})</div>
    <div class="state-grid">`;

  states.forEach(s=>{
    const cnt = stateMap[s].length;
    html += `<div class="state-card" onclick="goTeams('${esc(s)}')">
      <div class="state-name">${esc(s)}</div>
      <div class="state-count">${cnt} org${cnt>1?'s':''}</div>
    </div>`;
  });

  html += '</div>';
  m.innerHTML = html;
}

function renderTeams(){
  const m = document.getElementById('main');
  const fam = currentFamily;
  let members;
  if(fam.id==='indep'){
    members = orgs.filter(o=>o.family==='indep');
  } else {
    members = orgs.filter(o=>o.family===fam.id);
  }

  // Filter to state
  const stateOrgs = members.filter(o=>o.state.split('/').map(s=>s.trim()).includes(currentState));

  let html = `<button class="back-btn" onclick="goStates('${fam.id}')">← Back to ${esc(fam.name)} States</button>
    <div class="section-title">${esc(currentState)} — ${stateOrgs.length} Organization${stateOrgs.length>1?'s':''}</div>
    <div class="team-list">`;

  stateOrgs.forEach(o=>{
    const btCls = o.bt==='FOR-PROFIT'?'fp':'np';
    const nameHtml = na(o.web)?`<a href="${esc(o.web)}" target="_blank" rel="noopener">${esc(o.name)}</a>`:esc(o.name);

    let social = '';
    if(na(o.web)) social+=`<a class="social-link web" href="${esc(o.web)}" target="_blank">🌐 Website</a>`;
    if(na(o.ig) && o.ig!=='N/A'){
      const igUrl = 'https://instagram.com/'+o.ig.replace('@','');
      const fol = na(o.igfol) && o.igfol!=='N/A' ? ` (${Number(o.igfol).toLocaleString()})` : '';
      social+=`<a class="social-link ig" href="${igUrl}" target="_blank">📸 Instagram${fol}</a>`;
    }
    if(na(o.fb) && o.fb!=='N/A'){
      const fol = na(o.fbfol) && o.fbfol!=='N/A' && !isNaN(parseInt(o.fbfol)) ? ` (${parseInt(o.fbfol).toLocaleString()})` : '';
      social+=`<a class="social-link fb" href="https://facebook.com" target="_blank">📘 Facebook${fol}</a>`;
    }
    if(na(o.tw) && o.tw!=='N/A'){
      social+=`<a class="social-link tw" href="https://twitter.com/${o.tw.replace('@','')}" target="_blank">𝕏 Twitter</a>`;
    }

    html += `<div class="team-card ${btCls}">
      <div class="team-card-header">
        <div class="team-card-name">${nameHtml}</div>
        <div class="team-badges">
          <span class="badge ${btCls}">${o.bt==='FOR-PROFIT'?'For-Profit':'Nonprofit'}</span>
          ${o.gen==='Girls'?'<span class="gender-badge">Girls</span>':o.gen==='Co-ed'?'<span class="gender-badge" style="background:#f0fdf4;color:#15803d;border-color:#bbf7d0">Co-ed</span>':''}
        </div>
      </div>
      <div class="team-grid">
        <div class="team-field"><label>Location</label><span>${esc(o.city)||'<span class="na">N/A</span>'}</span></div>
        <div class="team-field"><label>Founded</label><span>${na(o.founded)?esc(o.founded):'<span class=\'na\'>N/A</span>'}</span></div>
        <div class="team-field"><label>Players</label><span>${na(o.players)?esc(o.players):'<span class=\'na\'>N/A</span>'}</span></div>
        <div class="team-field"><label>Head</label><span>${na(o.head)?esc(o.head):'<span class=\'na\'>N/A</span>'}</span></div>
        <div class="team-field"><label>Title</label><span>${na(o.title)?esc(o.title):'<span class=\'na\'>N/A</span>'}</span></div>
        <div class="team-field"><label>Email</label><span>${na(o.email)?`<a href="mailto:${esc(o.email)}" style="color:#3b82f6">${esc(o.email)}</a>`:'<span class=\'na\'>N/A</span>'}</span></div>
        <div class="team-field"><label>Phone</label><span>${na(o.phone)?`<a href="tel:${esc(o.phone)}" style="color:#3b82f6">${esc(o.phone)}</a>`:'<span class=\'na\'>N/A</span>'}</span></div>
        <div class="team-field"><label>Est. Revenue</label><span style="font-weight:700;color:#b45309">${fmtRev(o.rev)}</span></div>
      </div>
      ${social?`<div class="team-social">${social}</div>`:''}
      ${na(o.revnote)?`<div class="revenue-row"><strong>Revenue Notes: </strong><span>${esc(o.revnote)}</span></div>`:''}
    </div>`;
  });

  html += '</div>';
  m.innerHTML = html;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
